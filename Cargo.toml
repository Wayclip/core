[package]
name = "wayclip-core"
authors = ["konyogony <me@konyogony.dev>", "PadowYT2 <me@padow.dev>"]
description = "Core module for the Wayclip ecosystem: models, settings, and methods for App"
repository = "https://github.com/Wayclip/core"
license = "MIT"
version = "0.1.2"
edition = "2024"
readme = "README.md"

[dependencies]
env_logger = "0.11.11"
log = "0.4.33"
serde = "1.0.228"
serde_json = "1.0.150"
strum = "0.28.0"
strum_macros = "0.28.0"
chrono = { version = "0.4.45", features = ["serde"] }
utoipa = { version = "5.5.0", optional = true, features = [
  "actix_extras",
  "chrono",
  "debug",
  "uuid",
  "decimal",
  "url",
] }
sea-orm = { version = "2.0.0-rc.38", optional = true, features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "with-json",
  "postgres-array",
] }
nutype = { version = "0.7.0", features = [
  "regex",
  "serde",
  "derive_unchecked",
] }
regex = "1.12.3"
toml = "1.1.4"
zbus = { version = "5.16.0", default-features = false, features = ["blocking"] }
thiserror = "2.0.20"
semver = { version = "1.0.28", features = ["serde"] }
tokio = { version = "1.52.3", features = ["full"] }
bitflags = "2.13.0"
colored = "3.1.1"
cookie-rs = "0.5.0"
dirs = "6.0.0"
futures = "0.3.32"
futures-util = "0.3.32"
gilrs = "0.11.2"
itertools = "0.15.0"
keyring = { version = "4.1.2", features = ["v1", "cli"] }
nanoid = "0.5.0"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
sd-notify = "0.5.0"
url = { version = "2.5.8", features = ["serde"] }
wayclip-global-hotkey = "0.7.0"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-pbutils = "0.25.2"
paste = "1.0.15"
rodio = "0.22.2"
ashpd = { version = "0.13.11", optional = true, features = [
  "pipewire",
  "tracing",
  "tokio",
  "backend",
  "frontend",
] }

[features]
default = []
openapi = ["dep:utoipa", "dep:sea-orm"]
errors = ["dep:ashpd"]
