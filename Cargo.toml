[package]
name = "wayclip-core"
authors = ["konyogony <me@konyogony.dev>", "PadowYT2 <me@padow.dev>"]
description = "Core module for the Wayclip ecosystem: models, settings, and methods for App"
repository = "https://github.com/Wayclip/core"
license = "MIT"
version = "0.1.2"
edition = "2024"
readme = "README.md"

[dependencies]
ashpd = {
  version = "0.13.11",
  features = [
    "backend",
    "frontend",
    "pipewire",
    "tokio",
    "tracing",
  ],
  optional = true
}
bitflags = "2.13.0"
chrono = { version = "0.4.45", features = ["serde"] }
colored = "3.1.1"
cookie-rs = "0.5.0"
dirs = "6.0.0"
env_logger = "0.11.11"
futures = "0.3.32"
futures-util = "0.3.32"
gilrs = "0.11.2"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-pbutils = "0.25.2"
itertools = "0.15.0"
keyring = { version = "4.1.2", features = ["cli", "v1"] }
log = "0.4.33"
nanoid = "0.5.0"
nutype = {
  version = "0.7.0",
  features = [
    "derive_unchecked",
    "regex",
    "serde",
  ]
}
paste = "1.0.15"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
rodio = "0.22.2"
sd-notify = "0.5.0"
sea-orm = {
  version = "2.0.0-rc.38",
  features = [
    "postgres-array",
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "with-json",
  ],
  optional = true
}
semver = { version = "1.0.28", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.150"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.4"
url = { version = "2.5.8", features = ["serde"] }
utoipa = {
  version = "5.5.0",
  features = [
    "actix_extras",
    "chrono",
    "debug",
    "decimal",
    "url",
    "uuid",
  ],
  optional = true
}
wayclip-global-hotkey = "0.7.0"
zbus = { version = "5.16.0", default-features = false, features = ["blocking"] }

[features]
default = []
errors = ["dep:ashpd"]
openapi = ["dep:sea-orm", "dep:utoipa"]
